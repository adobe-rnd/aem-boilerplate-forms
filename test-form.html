<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Form</title>
  <link rel="stylesheet" href="blocks/form-tracker/form-tracker.css" />
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; }
    h1 { margin-bottom: 24px; font-size: 22px; }
    .field { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 14px; font-weight: 600; }
    input, select, textarea {
      padding: 8px 12px; border: 1px solid #ccc;
      border-radius: 4px; font-size: 14px; width: 100%;
    }
    button[type="submit"] {
      padding: 10px 24px; background: #0070f3;
      color: #fff; border: none; border-radius: 4px;
      cursor: pointer; font-size: 15px; margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Registration Form</h1>
  <form id="test-form">
    <div class="field">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="John Doe" required />
    </div>
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="john@example.com" required />
    </div>
    <div class="field">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required />
    </div>
    <div class="field">
      <label for="taxid">Tax ID</label>
      <input type="text" id="taxid" name="taxid" required />
    </div>
    <div class="field">
      <label for="country">Country</label>
      <select id="country" name="country" required>
        <option value="">Select country</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="in">India</option>
      </select>
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="3"></textarea>
    </div>
    <button type="submit">Submit</button>
  </form>

  <script type="module">
    import decorate from './blocks/form-tracker/form-tracker.js';
    const form = document.getElementById('test-form');
    decorate(form);
  </script>
</body>
</html>
